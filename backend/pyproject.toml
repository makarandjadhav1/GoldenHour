[project]
name = "goldenhour-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "psycopg[binary,pool]", "anthropic", "httpx"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
