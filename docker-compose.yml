services:
  db:
    image: postgres:17
    environment: { POSTGRES_USER: gh, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: goldenhour }
  api:
    build: backend
    environment: { DATABASE_URL: "postgresql://gh@db/goldenhour", WEB_ORIGIN: "http://localhost:5173" }
    ports: ["8080:8080"]
    depends_on: [db]
    command: sh -c "uv run --no-dev python seed.py && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8080"
